resourceActivity:
  - lang: cURL
    source: |
      curl --request GET \
        --url {{API_BASE_URL}}/actionlog/resource/8e3874ae-4b40-590b-968a-418f704b9d9a.json \
        --header 'Authorization: Bearer {{JWT_TOKEN}}'
  - lang: JavaScript
    source: |
      const url = '{{API_BASE_URL}}/actionlog/resource/8e3874ae-4b40-590b-968a-418f704b9d9a.json';
      const options = {
        method: 'GET',
        headers: {Authorization: 'Bearer {{JWT_TOKEN}}'}
      };

      try {
        const response = await fetch(url, options);
        const data = await response.json();
        console.log(data);
      } catch (error) {
        console.error(error);
      }

