resourceV5IndexAndView:
  allOf:
    - $ref: "e2eeObjects.yml#/e2eeMetadataBasedCommon"
    - type: "object"
      required:
        - resource_type_id
        - expired
      properties:
        resource_type_id:
          type: "string"
          format: "uuid"
        expired:
          type: "string"
          format: "date-time"
          x-nullable: true
        favorite:
          $ref: "favorites.yml#/favorite"
        secrets:
          type: "array"
          items:
            $ref: "secrets.yml#/secretIndex"
        resource_type:
          $ref: "resourceTypes.yml#/resourceType"

resourceV4IndexAndView:
  type: "object"
  required:
    - id
    - name
    - username
    - uri
    - description
    - deleted
    - created
    - created_by
    - modified_by
    - resource_type_id
    - expired
    - folder_parent_id
    - personal
  properties:
    id:
      type: "string"
      format: "uuid"
    name:
      type: "string"
    username:
      type: "string"
    uri:
      type: "string"
    description:
      type: "string"
    deleted:
      type: boolean
    created:
      type: "string"
      format: "date-time"
    created_by:
      type: "string"
      format: "uuid"
    modified_by:
      type: "string"
      format: "uuid"
    resource_type_id:
      type: "string"
      format: "uuid"
    expired:
      type: "string"
      format: "date-time"
      x-nullable: true
    folder_parent_id:
      type: "string"
      format: "uuid"
      x-nullable: true
    personal:
      type: boolean
    favorite:
      $ref: "favorites.yml#/favorite"
    modifier:
      $ref: "users.yml#/userIndexAndView"
    creator:
      $ref: "users.yml#/userIndexAndView"
    secrets:
      type: "array"
      items:
        $ref: "secrets.yml#/secretIndex"
    resource_type:
      $ref: "resourceTypes.yml#/resourceType"
    permission:
      $ref: "permissions.yml#/permissionIndexAndView"
    permissions:
      type: "array"
      items:
        $ref: "permissions.yml#/permissionIndexAndView"

resourceAddAndUpdate:
  allOf:
    - $ref: "e2eeObjects.yml#/e2eeMetadataBased"
    - type: "object"
      required:
        - expired
        - folder_parent_id
        - resource_type_id
        - secrets
      properties:
        expired:
          type: "string"
          format: "date-time"
          x-nullable: true
        folder_parent_id:
          type: "string"
          format: "uuid"
          x-nullable: true
        resource_type_id:
          type: "string"
          format: "uuid"
        secrets:
          description: >
            One entry per recipient. The `data` of each entry is an armoured
            OpenPGP message whose cleartext is the secret of the resource. Its
            shape depends on the resource type: a JSON object carrying
            `object_type` set to `PASSBOLT_SECRET_DATA` for every v5 type but
            `v5-password-string`, which encrypts the password as a bare string.
            The fields expected for each type are listed in the guide on
            working with v5 encrypted metadata.
          type: "array"
          items:
            $ref: "secrets.yml#/secretAdd"

resourceMetadataRotateKey:
  allOf:
    - $ref: "e2eeObjects.yml#/e2eeMetadataBasedCommon"
    - type: "object"
      required:
        - resource_type_id
      properties:
        resource_type_id:
          type: "string"
          format: "uuid"
