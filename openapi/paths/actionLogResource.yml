get:
  summary: "Get the activity of a resource."
  description: >
    Returns the interpreted activities recorded for a resource. The caller must
    have access to the resource: a resource that does not exist and a resource
    the caller cannot see are answered the same way.
  operationId: "indexActionLogResource"
  security:
    - bearerHttpAuthentication: []
  x-codeSamples:
    $ref: "../components/codeSamples/actionLogs.yml#/resourceActivity"
  tags:
    - "Action logs"
  parameters:
    - $ref: "../components/parameters.yml#/resourceId"
    - $ref: "../components/parameters.yml#/limit"
    - $ref: "../components/parameters.yml#/page"
  responses:
    200:
      $ref: "../components/responses/actionLogs.yml#/resourceIndex"
    400:
      $ref: "../components/responses/actionLogs.yml#/resourceIdentifierNotValid"
    401:
      $ref: "../components/responses.yml#/authenticationRequired"
    404:
      $ref: "../components/responses.yml#/notFound"
